name: Strix AI Security Scan

on:
  pull_request:
  workflow_dispatch:

jobs:
  strix-penetration-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Strix Security Scan (usestrix/strix)
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          STRIX_LLM: "openai/gpt-4o"
        run: |
          curl -sSL https://strix.ai/install | bash
          strix -n --target ./ --scan-mode quick --max-budget 10
